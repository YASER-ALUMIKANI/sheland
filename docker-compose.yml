version: '3.8'

services:
  sheland-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheland_marketplace
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SECRET_KEY=c3f19e48710ab52d96c4a8f3e271b05a7d91e84239f60e1d8a3b5c7e9f0a2b4c
      - JWT_SECRET_KEY=c3f19e48710ab52d96c4a8f3e271b05a7d91e84239f60e1d8a3b5c7e9f0a2b4c
    volumes:
      - ./backend/sheland.db:/app/backend/sheland.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
