version: '3.8'

services:
  sheland-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sheland_marketplace
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SECRET_KEY=sheland_secret_jwt_key_super_secure_2026
    volumes:
      - ./backend/sheland.db:/app/backend/sheland.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
