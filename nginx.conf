# Nginx Hardened Production Configuration for Sheland Marketplace
# Includes HTTPS/TLS 1.2+1.3, HSTS, OCSP Stapling, SSL Caching, Rate Limiting & Hardened Headers

# Hide Nginx version signature
server_tokens off;

# Rate Limiting Zones (DDoS & Brute-Force Protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_status 429;

# SSL Session Cache Configuration
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# Upstream Backend Definition
upstream fastapi_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 1. HTTP Server Block — Port 80 (301 Permanent Redirect to HTTPS + ACME Challenge)
server {
    listen 80;
    listen [::]:80;
    server_name sheland.ye www.sheland.ye sheland.com www.sheland.com;

    # Allow Let's Encrypt ACME Challenge Validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block — Port 443 (TLS 1.2/1.3 Hardened)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sheland.ye www.sheland.ye sheland.com www.sheland.com;

    # SSL Certificates (Let's Encrypt / Production Certs)
    ssl_certificate /etc/letsencrypt/live/sheland.ye/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheland.ye/privkey.pem;

    # Modern TLS Protocols & Cipher Suite Restriction
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # OCSP Stapling (Fast SSL Handshake Verification)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Comprehensive Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Responsible Disclosure (security.txt)
    location /.well-known/security.txt {
        alias /var/www/security.txt;
        default_type text/plain;
    }

    # Strict Login Rate Limiting (Brute-Force Shield)
    location /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General API & Application Requests
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Static Asset Caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp)$ {
        proxy_pass http://fastapi_app;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
